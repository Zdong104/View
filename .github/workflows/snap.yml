name: Snap

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: "Upload to the Snap Store edge channel (needs SNAPCRAFT_STORE_CREDENTIALS)"
        type: boolean
        default: false
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: build
        with:
          # the gnome extension supports core26 from snapcraft 9.2 (candidate as of 2026-10)
          snapcraft-channel: latest/candidate

      - name: Install and selftest
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap connections view || true
          # "view" alone would run vim's /usr/bin/view: use snap run
          snap run view --version
          snap run view --selftest --no-ui

      # The selftest runs under its own application ID, so it can't see launch
      # problems (0.1.0's snap exited at once: it wasn't allowed to own its
      # D-Bus name).  Launch it for real and open a PDF.
      - name: Launch and open a PDF
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick dbus-user-session
          packaging/snap/launch-test.sh

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: snap-launch-test
          path: launch-test/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Publish to edge
        if: ${{ inputs.publish && env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
