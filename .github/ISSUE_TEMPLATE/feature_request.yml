name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: macos
    attributes:
      label: How does macOS Preview do it?
      description: If the feature exists in macOS Preview, describe how it works there.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help?
      options:
        - "No, I just wanted to suggest it"
        - "I can test a build"
        - "I would like to implement it"
