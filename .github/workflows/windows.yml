name: Windows

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Code-sign the build (needs the Artifact Signing secrets and variables)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign:
        description: "Code-sign the build (needs the Artifact Signing secrets and variables)"
        type: boolean
        default: false
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Code signing (packaging/windows/sign.ps1). Smart App Control on Windows 11
      # blocks unsigned DLLs, so releases must be signed to start at all there.
      SIGN: ${{ inputs.sign && secrets.AZURE_CLIENT_ID != '' && '1' || '' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
          pacboy: >-
            python:p
            python-pip:p
            python-gobject:p
            python-cairo:p
            gtk4:p
            libadwaita:p
            adwaita-icon-theme:p
            librsvg:p
            poppler:p
            gstreamer:p
            gst-plugins-base:p
            gst-plugins-good:p
            gst-plugins-bad:p
            gst-plugins-ugly:p
            gst-libav:p
            gst-plugins-rs:p
            python-numpy:p
            python-pillow:p
            python-pyopengl:p
            python-pygments:p
            python-openpyxl:p
            python-pikepdf:p
            python-certifi:p
            pyinstaller:p
            pyinstaller-hooks-contrib:p

      - name: Python packages not in MSYS2
        run: |
          # MSYS2's Python is "externally managed" (PEP 668); this is a throwaway CI image.
          python -m pip install --break-system-packages --no-deps pypdf img2pdf
          python -c "import pypdf, img2pdf; print('pypdf', pypdf.__version__)"

      - name: Selftest from source (headless)
        env:
          GSK_RENDERER: cairo
        run: python -m preview --selftest --no-ui

      - name: Icon
        run: |
          mkdir -p build
          rsvg-convert -w 256 -h 256 data/io.github.zdong104.View.svg -o build/icon.png
          python -c "from PIL import Image; Image.open('build/icon.png').save('build/preview.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build/pyi packaging/windows/preview.spec
          # Mesa's software OpenGL for PCs without an OpenGL driver (VMs, Remote
          # Desktop; preview/opengl_win.py).  Installed only now so PyInstaller
          # can't mistake its opengl32.dll for the system's.
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-mesa
          gl=$(pacman -Ql mingw-w64-ucrt-x86_64-mesa | awk '{print $2}' | grep -i '/bin/opengl32\.dll$')
          python packaging/windows/bundle-mesa.py "$(cygpath -w "$gl")" dist/View
          bash packaging/windows/collect-licenses.sh dist/View
          # gone again, so no test below can pick up MSYS2's opengl32.dll from PATH
          pacman -Rdd --noconfirm mingw-w64-ucrt-x86_64-mesa
          du -sh dist/View

      # Text recognition runs in a helper process, view-ocr.exe, built with
      # python.org's Python: onnxruntime only publishes wheels for that one,
      # and MSYS2's own onnxruntime package has no working Python binding.
      # View starts ocr\view-ocr.exe on demand (preview/ocr.py).
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.13"

      - name: Text recognition helper (python.org Python)
        shell: pwsh
        run: |
          $py = "${{ steps.py.outputs.python-path }}"
          & $py -m pip install --disable-pip-version-check -r requirements-ocr.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m PyInstaller --noconfirm --clean --distpath build/ocr-dist --workpath build/pyi-ocr packaging/windows/view-ocr.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item build/ocr-dist/view-ocr dist/View/ocr
          $lic = "dist/View/licenses/ocr-helper"
          New-Item -ItemType Directory -Force $lic | Out-Null
          & $py packaging/windows/collect-python-licenses.py $lic > "$lic/PYTHON-PACKAGES.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "{0:N0} MB" -f ((Get-ChildItem dist/View/ocr -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: OCR test image
        run: |
          python - <<'EOF'
          from PIL import Image, ImageDraw, ImageFont
          im = Image.new("RGB", (640, 160), "white")
          d = ImageDraw.Draw(im)
          f = ImageFont.load_default(size=48)
          d.text((20, 20), "Hello View 2026", fill="black", font=f)
          d.text((20, 90), "Live Text works", fill="black", font=f)
          im.save("build/ocr-test.png")
          EOF

      - name: Smoke test (frozen)
        env:
          GSK_RENDERER: cairo
        run: |
          ./dist/View/view-app.exe --version
          # HTTPS to GitHub works from the frozen build (0 = up to date, 2 = newer exists)
          ./dist/View/view-app.exe --check-updates || [ $? -eq 2 ]
          ./dist/View/ocr/view-ocr.exe --test build/ocr-test.png "Hello View"
          # --ocr: View recognizes text through the helper (fails if it is missing)
          ./dist/View/view-app.exe --selftest --no-ui --ocr

      - name: Smoke test with windows (frozen, best effort)
        continue-on-error: true
        env:
          GSK_RENDERER: cairo
        run: timeout 300 env PATH=/c/Windows/system32:/c/Windows ./dist/View/view-app.exe --selftest

      # Time from launch to the first window, step by step (see runtime.mark).
      # The first run is the cold one; GitHub's runners have no real-time
      # antivirus scan, so a user's first launch can still be slower.
      # Time from launch to the first window, step by step (runtime.mark), and
      # any main-thread stall afterwards (runtime.StallWatch).  "fresh profile"
      # deletes every per-user cache first, like a user's very first start:
      # earlier steps here have already built the font and GStreamer caches.
      - name: Startup time (frozen)
        continue-on-error: true
        run: |
          python packaging/windows/test-files.py build/t
          gst-launch-1.0 -q videotestsrc num-buffers=90 ! video/x-raw,width=640,height=360 \
            ! vp8enc deadline=1 ! webmmux ! filesink location=build/t/sample.webm || true
          local_app=$(cygpath -u "$LOCALAPPDATA")
          fresh() {
            rm -rf "$local_app/fontconfig" "$local_app/View" "$local_app/gstreamer-1.0" \
                   "$local_app/recently-used.xbel" "$local_app/Microsoft/Windows/INetCache/view"
          }
          trace() {   # title, args...: print the trace and keep it as an annotation
            local title=$1; shift
            echo "== $title"
            # a user's PATH: Windows only, no MSYS2
            VIEW_STARTUP_TRACE_WAIT=6 timeout 180 env PATH=/c/Windows/system32:/c/Windows \
              ./dist/View/view-app.exe --startup-trace "$@" 2>&1 | tee build/trace.txt
            echo "::notice title=Startup: $title::$(sed -z 's/\r//g; s/\n/%0A/g' build/trace.txt)"
          }
          for f in "" sample.pdf sample.stl sample.webm sample.jpg; do
            fresh
            trace "fresh profile ${f:-(empty window)}" ${f:+build/t/$f}
          done
          for f in sample.pdf sample.webm sample.stl; do
            trace "again $f" build/t/$f
          done
          # does GTK load the system's opengl32.dll by itself (could Mesa load later)?
          VIEW_SOFTWARE_GL=0 trace "system OpenGL only sample.stl" build/t/sample.stl

      # The runners have no GPU, like many VMs: 3D must work through the
      # bundled Mesa, with a user's PATH (no MSYS2 on it).
      - name: 3D models without a GPU (frozen)
        run: |
          VIEW_STARTUP_TRACE_WAIT=4 timeout 180 env PATH=/c/Windows/system32:/c/Windows \
            ./dist/View/view-app.exe --startup-trace build/t/sample.stl 2>&1 | tee build/gl.txt
          grep -q "^OpenGL: Mesa" build/gl.txt
          ! grep -q "OpenGL failed" build/gl.txt

      - name: Code signing (app files)
        if: ${{ env.SIGN }}
        shell: pwsh
        run: |
          ./packaging/windows/sign.ps1 -Path dist/View
          ./dist/View/view-app.exe --version
          ./dist/View/ocr/view-ocr.exe --test build/ocr-test.png "Hello View"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Code signing skipped
        if: ${{ inputs.sign && !env.SIGN }}
        run: echo "::warning::sign was requested but AZURE_CLIENT_ID is not set; this build is unsigned and Smart App Control will block it"

      - name: Portable zip
        run: |
          VERSION=$(python -c "import preview; print(preview.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd dist && zip -qr "View-$VERSION-windows-portable.zip" View && ls -la

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $p = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $p)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          } else { $iscc = $iscc.Source }
          $sign = @()
          if ($env:SIGN) {
            $sign = @("/DSign", "/Sviewsign=pwsh -NoProfile -File $PWD\packaging\windows\sign.ps1 -Path `$f")
          }
          & $iscc /Q "/DAppVersion=$env:VERSION" @sign packaging\windows\preview.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/View-Setup-*.exe
            dist/View-*-windows-portable.zip
          if-no-files-found: error
