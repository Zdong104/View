name: view
title: View
version: '0.1.1'
summary: View and annotate PDFs, images, videos, text and 3D models
description: |
  View is a fast, macOS Preview-style viewer for GNOME. One app opens
  PDFs, images, videos, spreadsheets, source code and 3D models, and lets
  you mark them up and sign them.

  * PDFs: thumbnails, search, highlights and notes, forms, page reordering,
    merging and signing
  * Images: markup, crop, rotate, color adjustments, combine into a PDF
  * Signatures drawn on the touchpad (connect raw-input, see below) or with
    a mouse, pen or finger
  * Live Text: select and copy text in images and scanned PDFs (OCR included)
  * Video and audio playback, CSV/TSV editor, syntax-highlighted code,
    STL/OBJ/PLY model viewer

  Touchpad signing reads the touchpad directly and needs:
    sudo snap connect view:raw-input

  The GNOME Files integration (Space-bar Quick Look, "Combine Images into
  PDF" script) is not available in the snap; use the .deb for that.
license: PolyForm-Noncommercial-1.0.0
website: https://github.com/Zdong104/View
source-code: https://github.com/Zdong104/View
issues: https://github.com/Zdong104/View/issues
donation: https://buymeacoffee.com/zdong
icon: data/io.github.zdong104.View.svg

# core26 = Ubuntu 26.04: the gnome extension's gnome-core26 content snap
# carries GTK 4.22 / libadwaita 1.9 / GStreamer 1.28 / Python 3.14, which is
# exactly what View is developed against.
base: core26
grade: devel
confinement: strict

platforms:
  amd64:

# GApplication owns its application ID on the session bus at startup and
# exits if it can't; strict confinement only allows that for a name the snap
# declares as a dbus slot.
slots:
  view-dbus:
    interface: dbus
    bus: session
    name: io.github.zdong104.View

apps:
  view:
    command: usr/bin/view-app
    desktop: usr/share/applications/io.github.zdong104.View.desktop
    common-id: io.github.zdong104.View
    extensions: [gnome]
    slots: [view-dbus]
    plugs:
      - home
      - removable-media
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - gsettings           # must be explicit on core26 (wallpaper, GTK settings)
      - audio-playback
      - raw-input           # touchpad signing (evdev); manual: snap connect view:raw-input

parts:
  view:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
      - requirements-ocr.txt
    stage-packages:
      - python3-venv                    # interpreter for the plugin's venv
      # PyGObject + pycairo come from the gnome-core26 platform: the core26
      # gnome extension deletes every .so the SDK also has, which would strip
      # the binary modules out of staged python3-gi/python3-cairo anyway.
      - gir1.2-poppler-0.18
      - gstreamer1.0-plugins-bad        # VA-API decoders (va), more demuxers
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-gtk4               # gtk4paintablesink (also in gnome-core26)
      - libegl1
      - libgl1
      - ghostscript                     # "Reduce File Size"
    override-build: |
      craftctl default
      TRIPLET="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      install -d "$CRAFT_PART_INSTALL/usr/lib/view-app" "$CRAFT_PART_INSTALL/usr/bin"
      cp -r "$CRAFT_PART_SRC/preview" "$CRAFT_PART_INSTALL/usr/lib/view-app/"
      find "$CRAFT_PART_INSTALL/usr/lib/view-app" -name __pycache__ -prune -exec rm -rf {} +
      cat > "$CRAFT_PART_INSTALL/usr/bin/view-app" <<EOF
      #!/bin/sh
      # View snap launcher: our staged typelibs, GStreamer plugins and
      # Python modules first, then the gnome-core26 platform.
      A=$TRIPLET
      # PyGObject/pycairo from the platform (the extension puts them on
      # PYTHONPATH); our package and staged pure-Python modules first.
      export PYTHONPATH="\$SNAP/usr/lib/view-app:\$SNAP/usr/lib/python3/dist-packages:\$SNAP/gnome-platform/usr/lib/python3/dist-packages\${PYTHONPATH:+:\$PYTHONPATH}"
      export GI_TYPELIB_PATH="\$SNAP/usr/lib/\$A/girepository-1.0\${GI_TYPELIB_PATH:+:\$GI_TYPELIB_PATH}"
      export LD_LIBRARY_PATH="\${LD_LIBRARY_PATH:+\$LD_LIBRARY_PATH:}\$SNAP/usr/lib/\$A:\$SNAP/usr/lib/\$A/blas:\$SNAP/usr/lib/\$A/lapack"
      export GST_PLUGIN_SYSTEM_PATH="\$SNAP/usr/lib/\$A/gstreamer-1.0:\$SNAP/gnome-platform/usr/lib/\$A/gstreamer-1.0"
      for s in "\$SNAP/usr/lib/\$A/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner" \
               "\$SNAP/gnome-platform/usr/lib/\$A/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner"; do
          [ -x "\$s" ] && export GST_PLUGIN_SCANNER="\$s" && break
      done
      export GST_REGISTRY="\$SNAP_USER_COMMON/gstreamer-registry.bin"
      exec "\$SNAP/bin/python3" -s -m preview "\$@"
      EOF
      chmod 755 "$CRAFT_PART_INSTALL/usr/bin/view-app"
      install -Dm644 "$CRAFT_PART_SRC/data/io.github.zdong104.View.svg" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.zdong104.View.svg"
      install -Dm644 "$CRAFT_PART_SRC/data/io.github.zdong104.View.metainfo.xml" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.zdong104.View.metainfo.xml"
      install -d "$CRAFT_PART_INSTALL/usr/share/applications"
      sed -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/io.github.zdong104.View.svg|' \
        "$CRAFT_PART_SRC/data/io.github.zdong104.View.desktop" \
        > "$CRAFT_PART_INSTALL/usr/share/applications/io.github.zdong104.View.desktop"
