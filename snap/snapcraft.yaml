name: preview
title: Preview
version: '0.1.0'
summary: View and annotate PDFs, images, videos, text and 3D models
description: |
  Preview is a fast, macOS Preview-style viewer for GNOME. One app opens
  PDFs, images, videos, spreadsheets, source code and 3D models, and lets
  you mark them up and sign them.

  * PDFs: thumbnails, search, highlights and notes, forms, page reordering,
    merging and signing
  * Images: markup, crop, rotate, color adjustments, combine into a PDF
  * Signatures drawn on the touchpad (connect raw-input, see below) or with
    a mouse, pen or finger
  * Live Text: select and copy text in images and scanned PDFs (OCR included)
  * Video and audio playback, CSV/TSV editor, syntax-highlighted code,
    STL/OBJ/PLY model viewer

  Touchpad signing reads the touchpad directly and needs:
    sudo snap connect preview:raw-input

  The GNOME Files integration (Space-bar Quick Look, "Combine Images into
  PDF" script) is not available in the snap; use the .deb for that.
license: PolyForm-Noncommercial-1.0.0
website: https://github.com/Zdong104/Preview
source-code: https://github.com/Zdong104/Preview
issues: https://github.com/Zdong104/Preview/issues
donation: https://buymeacoffee.com/zdong
icon: data/io.github.zdong104.Preview.svg

# core26 = Ubuntu 26.04: the gnome extension's gnome-core26 content snap
# carries GTK 4.22 / libadwaita 1.9 / GStreamer 1.28 / Python 3.14, which is
# exactly what Preview is developed against.
base: core26
grade: devel
confinement: strict

platforms:
  amd64:

apps:
  preview:
    command: usr/bin/preview-app
    desktop: usr/share/applications/io.github.zdong104.Preview.desktop
    common-id: io.github.zdong104.Preview
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - gsettings           # must be explicit on core26 (wallpaper, GTK settings)
      - audio-playback
      - raw-input           # touchpad signing (evdev); manual: snap connect preview:raw-input

parts:
  preview:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
      - requirements-ocr.txt
    stage-packages:
      - python3-venv                    # interpreter for the plugin's venv
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - gir1.2-poppler-0.18
      - gstreamer1.0-plugins-bad        # VA-API decoders (va), more demuxers
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-gtk4               # gtk4paintablesink (also in gnome-core26)
      - libegl1
      - libgl1
      - ghostscript                     # "Reduce File Size"
    override-build: |
      craftctl default
      TRIPLET="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      install -d "$CRAFT_PART_INSTALL/usr/lib/preview-app" "$CRAFT_PART_INSTALL/usr/bin"
      cp -r "$CRAFT_PART_SRC/preview" "$CRAFT_PART_INSTALL/usr/lib/preview-app/"
      find "$CRAFT_PART_INSTALL/usr/lib/preview-app" -name __pycache__ -prune -exec rm -rf {} +
      cat > "$CRAFT_PART_INSTALL/usr/bin/preview-app" <<EOF
      #!/bin/sh
      # Preview snap launcher: our staged typelibs, GStreamer plugins and
      # Python modules first, then the gnome-core26 platform.
      A=$TRIPLET
      export PYTHONPATH="\$SNAP/usr/lib/preview-app:\$SNAP/usr/lib/python3/dist-packages\${PYTHONPATH:+:\$PYTHONPATH}"
      export GI_TYPELIB_PATH="\$SNAP/usr/lib/\$A/girepository-1.0\${GI_TYPELIB_PATH:+:\$GI_TYPELIB_PATH}"
      export LD_LIBRARY_PATH="\${LD_LIBRARY_PATH:+\$LD_LIBRARY_PATH:}\$SNAP/usr/lib/\$A:\$SNAP/usr/lib/\$A/blas:\$SNAP/usr/lib/\$A/lapack"
      export GST_PLUGIN_SYSTEM_PATH="\$SNAP/usr/lib/\$A/gstreamer-1.0:\$SNAP/gnome-platform/usr/lib/\$A/gstreamer-1.0"
      for s in "\$SNAP/usr/lib/\$A/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner" \
               "\$SNAP/gnome-platform/usr/lib/\$A/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner"; do
          [ -x "\$s" ] && export GST_PLUGIN_SCANNER="\$s" && break
      done
      export GST_REGISTRY="\$SNAP_USER_COMMON/gstreamer-registry.bin"
      exec "\$SNAP/bin/python3" -s -m preview "\$@"
      EOF
      chmod 755 "$CRAFT_PART_INSTALL/usr/bin/preview-app"
      install -Dm644 "$CRAFT_PART_SRC/data/io.github.zdong104.Preview.svg" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.zdong104.Preview.svg"
      install -Dm644 "$CRAFT_PART_SRC/data/io.github.zdong104.Preview.metainfo.xml" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.zdong104.Preview.metainfo.xml"
      install -d "$CRAFT_PART_INSTALL/usr/share/applications"
      sed -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/io.github.zdong104.Preview.svg|' \
        "$CRAFT_PART_SRC/data/io.github.zdong104.Preview.desktop" \
        > "$CRAFT_PART_INSTALL/usr/share/applications/io.github.zdong104.Preview.desktop"

  # Drop shared libraries the base and the GNOME platform snap already
  # provide, so staged .debs cannot shadow the platform's GTK/GLib stack.
  # Python itself (interpreter, PyGObject with its cairo bridge) is kept.
  cleanup:
    after: [preview]
    plugin: nil
    build-snaps: [core26, gnome-core26]
    override-prime: |
      set -eu
      for snap in core26 gnome-core26; do
        cd "/snap/$snap/current"
        # (find fails on a missing dir, e.g. lib/ in gnome-core26: tolerate it)
        { find usr/lib lib -type f,l \( -name '*.so' -o -name '*.so.*' \) \
               -not -path '*python3*' -not -name 'libpython3*' 2>/dev/null || true; } \
          | while read -r f; do rm -f "$CRAFT_PRIME/$f"; done
      done
