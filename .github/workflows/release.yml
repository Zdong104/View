name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    uses: ./.github/workflows/deb.yml

  snap:
    uses: ./.github/workflows/snap.yml
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      sign: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  chrome:
    uses: ./.github/workflows/chrome.yml

  release:
    needs: [deb, snap, windows, chrome]
    # publish whatever built: a failed snap, Windows or Chrome build must not block the .deb
    if: ${{ !cancelled() && needs.deb.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and checksums
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.deb' -o -name '*.snap' -o -name 'View-Setup-*.exe' \
               -o -name 'View-*-windows-portable.zip' -o -name 'view-chrome-*.zip' \) -exec cp {} upload/ \;
          cd upload && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the notes come from the metainfo; View's updater shows them
          python3 packaging/release-notes.py "$TAG" > notes.md && cat notes.md
          # a re-run (after a flaky job) adds the missing files to the release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
          else
            gh release create "$TAG" upload/* --title "View ${TAG#v}" --notes-file notes.md \
              $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi
