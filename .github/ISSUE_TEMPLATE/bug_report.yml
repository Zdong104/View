name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Preview is only tested on Ubuntu 26.04, so details about your system help a lot.
  - type: input
    id: version
    attributes:
      label: Preview version
      description: Output of `preview-app --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "Ubuntu 26.04, GNOME 50"
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      options: [Wayland, X11, Windows, Not sure]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [".deb (apt / dpkg)", Snap, From source (make run), Windows installer, Other]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU / graphics driver
      placeholder: "Intel Arc, Mesa 26.x / NVIDIA RTX 4000, driver 580"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF with ...
        2. Click ...
        3. See the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Screenshots are welcome (drag them in). Please do not attach private documents.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run `preview-app` from a terminal and paste what it prints.
      render: shell
